inventory:
  - host: 127.0.0.1
    user: root
    port: 2222

  - host: 127.0.0.1
    user: root
    port: 2223
steps:
  - name: echo
    value: "Hello world"

  - name: echo
    value: "Hello world number 2"

  - name: http
    url: https://jsonplaceholder.typicode.com/posts/1
    method: GET

  - name: shell
    cmd: rm showing_that_it_works.txt && rm count.txt

  - name: shell
    cmd: touch showing_that_it_works.txt

  - name: shell
    cmd: echo "IT WORKS!" >> showing_that_it_works.txt
    save_as:
      successful_write: "result.exitCode == 0"
      const_for_show: 42

  - name: if
    condition: "successful_write && const_for_show == 42"
    then:
      - name: shell
        cmd: echo "Condition is true!!!" >> showing_that_it_works.txt
    else:
      - name: shell
        cmd: echo "Condition is false!!!" >> showing_that_it_works.txt

      - name: shell
        cmd: ech "Wrong"
        save_as:
          echo_err: result.stderr

  - name: echo
    value: just for creating var
    save_as:
      count: 1

  - name: for
    condition: "count < 3"
    do:
      - name: shell
        cmd: echo "Counting" >> count.txt
        save_as:
          count: "count + 1"
