inventory:
  - host: 127.0.0.1
    user: root
    port: 2222

  - host: 127.0.0.1
    user: root
    port: 2223
steps:
  - name: echo
    value: "Hello Agent"

  - name: echo
    value: "Hello world number 2"

  - name: http
    url: https://httpbin.org/post
    method: POST
    headers:
      Content-Type: application/json
      X-Flowcast-Test: hello-from-agent
    body: '{"host": "agent", "count": 3}'
    save_as:
      status: result.StatusCode
      sent_header: 'result.Body contains "hello-from-agent"'
      sent_body: 'result.Body contains "\"count\": 3"'

  - name: if
    condition: "status == 200 && sent_header && sent_body"
    then:
      - name: echo
        value: "POST ok: header and body arrived"
    else:
      - name: echo
        value: "POST check failed"
  
  - name: shell
    cmd: rm showing_that_it_works.txt && rm count.txt

  - name: shell
    cmd: touch showing_that_it_works.txt

  - name: shell
    cmd: echo "IT WORKS!" >> showing_that_it_works.txt
    save_as:
      successful_write: "result.ExitCode == 0"
      const_for_show: 42

  - name: if
    condition: "successful_write && const_for_show == 42"
    then:
      - name: shell
        cmd: echo "Condition is true!!!" >> showing_that_it_works.txt
    else:
      - name: shell
        cmd: echo "Condition is false!!!" >> showing_that_it_works.txt

      - name: shell
        cmd: ech "Wrong"
        save_as:
          echo_err: result.stderr

  - name: set_var
    save_as:
      count: 1

  - name: for
    condition: "count < 3"
    max_iterations: 10
    delay: 0s
    do:
      - name: shell
        cmd: "echo Counting {{ count }} >> count.txt"
        save_as:
          count: "count + 1"
